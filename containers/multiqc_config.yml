# =============================================================================
# multiqc_config.yml — LoReRNA pipeline MultiQC configuration
#
# Placed in containers/ and staged into the MULTIQC work directory.
# Controls report title, section order, and custom data parsing for
# tools that MultiQC does not natively understand (IsoQuant, MisER QC).
# =============================================================================

title: "LoReRNA QC Report"
subtitle: "Long-read RNA-seq: MisER → IsoQuant → Oarfish → swish"
report_comment: "Generated by the LoReRNA pipeline v1.0.0"

# ── Section order ─────────────────────────────────────────────────────────────
# Sections are shown in this order in the report.
module_order:
  - custom_content         # IsoQuant QC, MisER QC, swish summary (parsed below)
  - samtools               # flagstat + idxstats auto-detected from *_flagstat.txt

# ── Custom content ────────────────────────────────────────────────────────────
# Each entry corresponds to a file pattern that MultiQC will detect.
# Files are written by ISOQUANT_QC and MISER_QC_MERGE processes.

custom_data:

  isoquant_assignment:
    id: "isoquant_assignment"
    section_name: "IsoQuant Read Assignments"
    description: >
      Per-sample breakdown of how reads were assigned by IsoQuant.
      <b>unique</b>: unambiguously assigned to one isoform.
      <b>ambiguous</b>: consistent with multiple isoforms.
      <b>inconsistent</b>: mapped but inconsistent with any annotated isoform.
      <b>not_assigned</b>: could not be assigned (includes noninformative reads).
    plot_type: "bargraph"
    pconfig:
      id: "isoquant_assignment_plot"
      title: "IsoQuant: Read Assignment Types"
      ylab: "Number of reads"
      cpswitch_counts_label: "Number of reads"
      stacking: "normal"
    file_format: "tsv"
    headers:
      unique:
        title: "Unique"
        description: "Reads assigned uniquely to one isoform"
        colour: "#2ECC71"
      unique_minor_difference:
        title: "Unique (minor diff.)"
        description: "Uniquely assigned with minor alignment differences"
        colour: "#27AE60"
      ambiguous:
        title: "Ambiguous"
        description: "Consistent with multiple isoforms"
        colour: "#F39C12"
      inconsistent:
        title: "Inconsistent"
        description: "Mapped but inconsistent with annotation"
        colour: "#E74C3C"
      not_assigned:
        title: "Not assigned"
        description: "Could not be assigned (includes noninformative)"
        colour: "#95A5A6"

  # MisER micro-exon rescue — split into scale-coherent, coloured bargraphs by
  # bin/miser_rescue_multiqc.py (one *_mqc.tsv per metric group). Colours are
  # applied here via headers (the mechanism MultiQC honours for custom content).

  miser_passrate:
    id: "miser_passrate"
    section_name: "MisER — Read-event pass rate"
    description: >
      Percentage of MisER read events that passed the realignment filter, per sample.
    plot_type: "bargraph"
    pconfig:
      id: "miser_passrate_plot"
      title: "MisER: read-event pass rate (%)"
      ylab: "Pass rate (%)"
      cpswitch: false
    file_format: "tsv"
    headers:
      pass_rate:
        title: "Pass rate (%)"
        colour: "#2ca02c"

  miser_events:
    id: "miser_events"
    section_name: "MisER — Read events"
    description: >
      MisER read events per sample, split into passed vs failed.
    plot_type: "bargraph"
    pconfig:
      id: "miser_events_plot"
      title: "MisER: passed vs failed read events"
      ylab: "Read events"
      stacking: "normal"
    file_format: "tsv"
    headers:
      passed:
        title: "Passed"
        colour: "#2ca02c"
      failed:
        title: "Failed"
        colour: "#d62728"

  miser_support:
    id: "miser_support"
    section_name: "MisER — Micro-exon read support"
    description: >
      Unique rescued micro-exons split by read support: single-read vs
      multi-read (their sum is the total unique micro-exons).
    plot_type: "bargraph"
    pconfig:
      id: "miser_support_plot"
      title: "MisER: micro-exon read support"
      ylab: "Micro-exons"
      stacking: "normal"
    file_format: "tsv"
    headers:
      single_read:
        title: "Single-read"
        colour: "#aec7e8"
      multi_read:
        title: "Multi-read"
        colour: "#1f77b4"

  miser_exonsize:
    id: "miser_exonsize"
    section_name: "MisER — Median micro-exon size"
    description: >
      Median rescued micro-exon size (bp) per sample.
    plot_type: "bargraph"
    pconfig:
      id: "miser_exonsize_plot"
      title: "MisER: median micro-exon size (bp)"
      ylab: "bp"
      cpswitch: false
    file_format: "tsv"
    headers:
      median_size:
        title: "Median size (bp)"
        colour: "#ff7f0e"

  swish_summary:
    id: "swish_summary"
    section_name: "SWISH Differential Analysis"
    description: >
      Summary of fishpond/swish results across DTE, DTU, and DGE analyses.
      FDR threshold = alpha parameter (default 0.05).
    plot_type: "bargraph"
    pconfig:
      id: "swish_summary_bargraph"
      title: "SWISH: Significant features by analysis type"
      ylab: "Count"
      cpswitch: false
    file_format: "tsv"

# ── File search patterns ──────────────────────────────────────────────────────
# Tell MultiQC where to look for the custom files produced by the pipeline.

sp:
  isoquant_assignment:
    fn: "*_isoquant_mqc.tsv"
  miser_passrate:
    fn: "miser_passrate_mqc.tsv"
  miser_events:
    fn: "miser_events_mqc.tsv"
  miser_support:
    fn: "miser_support_mqc.tsv"
  miser_exonsize:
    fn: "miser_exonsize_mqc.tsv"
  swish_summary:
    fn: "*swish_summary_mqc.tsv"
  samtools/flagstat:
    fn: "*_flagstat.txt"
  samtools/idxstats:
    fn: "*_idxstats.txt"
  samtools/stats:
    fn: "*_stats.txt"

# ── Report aesthetics ─────────────────────────────────────────────────────────
plots_force_interactive: true
export_plots: true
make_data_dir: true

# ── Suppress noisy warnings for missing modules ───────────────────────────────
log_filesize_limit: 10000000
ignore_symlinks: false
