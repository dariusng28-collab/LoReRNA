# =============================================================================
# multiqc_config.yml — LoReRNA pipeline MultiQC configuration
#
# Placed in containers/ and staged into the MULTIQC work directory.
# Controls report title, section order, and custom data parsing for
# tools that MultiQC does not natively understand (IsoQuant, MisER QC).
# =============================================================================

title: "LoReRNA QC Report"
subtitle: "Long-read RNA-seq: MisER → IsoQuant → Oarfish → swish"
report_comment: "Generated by the LoReRNA pipeline v1.0.0"

# ── Section order ─────────────────────────────────────────────────────────────
# Sections are shown in this order in the report.
module_order:
  - custom_content         # IsoQuant QC, MisER QC, swish summary (parsed below)
  - samtools               # flagstat + idxstats auto-detected from *_flagstat.txt

# ── Custom content ────────────────────────────────────────────────────────────
# Each entry corresponds to a file pattern that MultiQC will detect.
# Files are written by ISOQUANT_QC and MISER_QC_MERGE processes.

custom_data:

  isoquant_assignment:
    id: "isoquant_assignment"
    section_name: "IsoQuant Read Assignments"
    description: >
      Per-sample breakdown of how reads were assigned by IsoQuant.
      <b>unique</b>: unambiguously assigned to one isoform.
      <b>ambiguous</b>: consistent with multiple isoforms.
      <b>inconsistent</b>: mapped but inconsistent with any annotated isoform.
      <b>not_assigned</b>: could not be assigned (includes noninformative reads).
    plot_type: "bargraph"
    pconfig:
      id: "isoquant_assignment_plot"
      title: "IsoQuant: Read Assignment Types"
      ylab: "Number of reads"
      cpswitch_counts_label: "Number of reads"
      stacking: "normal"
    file_format: "tsv"
    headers:
      unique:
        title: "Unique"
        description: "Reads assigned uniquely to one isoform"
        colour: "#2ECC71"
      unique_minor_difference:
        title: "Unique (minor diff.)"
        description: "Uniquely assigned with minor alignment differences"
        colour: "#27AE60"
      ambiguous:
        title: "Ambiguous"
        description: "Consistent with multiple isoforms"
        colour: "#F39C12"
      inconsistent:
        title: "Inconsistent"
        description: "Mapped but inconsistent with annotation"
        colour: "#E74C3C"
      not_assigned:
        title: "Not assigned"
        description: "Could not be assigned (includes noninformative)"
        colour: "#95A5A6"

  # MisER micro-exon rescue is now emitted as a self-describing multi-dataset
  # bargraph (per-metric switcher) by bin/miser_rescue_multiqc.py →
  # miser_rescue_mqc.json, so it needs no custom_data / sp entry here.

  swish_summary:
    id: "swish_summary"
    section_name: "SWISH Differential Analysis"
    description: >
      Summary of fishpond/swish results across DTE, DTU, and DGE analyses.
      FDR threshold = alpha parameter (default 0.05).
    plot_type: "bargraph"
    pconfig:
      id: "swish_summary_bargraph"
      title: "SWISH: Significant features by analysis type"
      ylab: "Count"
      cpswitch: false
    file_format: "tsv"

# ── File search patterns ──────────────────────────────────────────────────────
# Tell MultiQC where to look for the custom files produced by the pipeline.

sp:
  isoquant_assignment:
    fn: "*_isoquant_mqc.tsv"
  swish_summary:
    fn: "*swish_summary_mqc.tsv"
  samtools/flagstat:
    fn: "*_flagstat.txt"
  samtools/idxstats:
    fn: "*_idxstats.txt"
  samtools/stats:
    fn: "*_stats.txt"

# ── Report aesthetics ─────────────────────────────────────────────────────────
plots_force_interactive: true
export_plots: true
make_data_dir: true

# ── Suppress noisy warnings for missing modules ───────────────────────────────
log_filesize_limit: 10000000
ignore_symlinks: false
