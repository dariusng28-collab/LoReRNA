name: Bug report
description: Report something that is broken or behaving unexpectedly
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug. The more of the detail below you can give,
        the faster this can be diagnosed — most LoReRNA issues are pinned down
        from the failing process's `.command.sh` / `.command.err` plus the
        Nextflow version and profile.

  - type: textarea
    id: description
    attributes:
      label: Description
      description: What happened, and what did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: command
    attributes:
      label: Command used
      description: The full `nextflow run` command, including profiles and `-c` configs.
      render: bash
    validations:
      required: true

  - type: textarea
    id: error
    attributes:
      label: Error message
      description: |
        The error Nextflow printed. If a process failed, please include the
        `Command error` / `Command exit status` block and the work directory path.
      render: text
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant log output
      description: |
        Useful extras, if available:
        - the failing task's `.command.sh` and `.command.err` (from the work dir)
        - relevant lines from `.nextflow.log`
      render: text

  - type: input
    id: nextflow_version
    attributes:
      label: Nextflow version
      description: Output of `nextflow -version`
      placeholder: "25.04.7"
    validations:
      required: true

  - type: dropdown
    id: profile
    attributes:
      label: Profile / container engine
      options:
        - singularity
        - docker
        - conda
        - other (describe below)
    validations:
      required: true

  - type: dropdown
    id: executor
    attributes:
      label: Executor
      options:
        - local
        - SGE / UGE
        - SLURM
        - LSF
        - other (describe below)
    validations:
      required: true

  - type: input
    id: container_version
    attributes:
      label: Container versions
      description: Values of `container_lorerna` / `container_miser` from your config.
      placeholder: "dariusng28/lorerna:1.1.0, dariusng28/miser:1.1.0"

  - type: textarea
    id: samplesheet
    attributes:
      label: Samplesheet (header + a row or two)
      description: Please remove or anonymise any sensitive paths.
      render: text
